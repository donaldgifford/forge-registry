name: Plugin Feature
description: New plugin or plugin enhancement
title: "[Plugin] "
labels: ["type:feature", "status:planned"]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 (Blocker)
        - P1 (High)
        - P2 (Medium)
        - P3 (Low)
    validations:
      required: true

  - type: dropdown
    id: plugin_type
    attributes:
      label: Plugin Type
      options:
        - Collector
        - Auditor
        - Notifier
        - SDK
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Cloud Provider
      options:
        - AWS
        - GCP
        - Azure
        - Kubernetes
        - Other

  - type: dropdown
    id: size
    attributes:
      label: Estimated Size
      options:
        - XS (< 2 hours)
        - S (2-4 hours)
        - M (4-8 hours)
        - L (1-2 days)
        - XL (2+ days)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should this plugin do?
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
    validations:
      required: true

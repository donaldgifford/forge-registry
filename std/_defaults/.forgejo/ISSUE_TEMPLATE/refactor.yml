name: Refactoring
description: Code refactoring or technical debt
title: "[Refactor] "
labels: ["type:refactor", "status:planned"]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 (Blocker)
        - P1 (High)
        - P2 (Medium)
        - P3 (Low)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API
        - Database
        - Auth
        - Scheduler
        - Worker
        - Queue
        - Config
        - Logging
        - Plugin SDK
        - Testing
        - CI/CD
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Estimated Size
      options:
        - XS (< 2 hours)
        - S (2-4 hours)
        - M (4-8 hours)
        - L (1-2 days)
        - XL (2+ days)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be refactored?
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Why is this refactoring needed?
    validations:
      required: true

  - type: textarea
    id: components
    attributes:
      label: Affected Components
      description: What code/components will change?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

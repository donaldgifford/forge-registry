# git-cliff configuration for ${project_name} root CHANGELOG.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. The format is
based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and
this project adheres to [Semantic Versioning](https://semver.org/).

"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""

trim = true
render_always = true

postprocessors = [
  { pattern = '<REPO>', replace = "https://github.com/donaldgifford/forge-registry" },
]

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
fail_on_unmatched_commit = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false
use_branch_tags = false

commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))" },
]

# Order matters twice over. Within this list the first match wins, so
# the blueprint rule has to precede the generic type rules. In the
# rendered changelog the sections are sorted by the `<!-- NN -->`
# prefix, which `striptags` removes before display; the numbers are
# zero-padded because that sort is lexicographic, and unpadded `10`
# would land between `1` and `2`.
commit_parsers = [
  # A commit scoped to a blueprint is a change to something consumers
  # pin by version. That matters more to a reader than whether it was
  # a feat or a fix, so those commits get their own section instead of
  # being scattered across the type groups.
  { message = "^[a-z]+\\((bun|go|homelab|rust|std)/[a-z0-9-]+\\)", group = "<!-- 00 -->Blueprint Changes" },
  { message = "^feat", group = "<!-- 01 -->Features" },
  { message = "^fix", group = "<!-- 02 -->Bug Fixes" },
  { message = "^refactor", group = "<!-- 03 -->Refactor" },
  { message = "^doc", group = "<!-- 04 -->Documentation" },
  { message = "^perf", group = "<!-- 05 -->Performance" },
  { message = "^style", group = "<!-- 06 -->Styling" },
  { message = "^test", group = "<!-- 07 -->Testing" },
  # Broadened from `^chore\(release\): prepare for`: the release job
  # now writes `chore(release): vX.Y.Z`, and that commit must stay out
  # of the section it is itself creating.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore.*[Cc]hangelog", skip = true },
  { message = "^chore|^ci|^build", group = "<!-- 08 -->Miscellaneous Tasks" },
  { body = ".*security", group = "<!-- 09 -->Security" },
  { message = "^revert", group = "<!-- 10 -->Revert" },
  { message = ".*", group = "<!-- 11 -->Other" },
]

link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/donaldgifford/forge-registry/issues/$1" },
]

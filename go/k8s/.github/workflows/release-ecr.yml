---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Release

# Self-contained ECR release train. On merge to main:
#   bump-version — semver bump + tag derived from PR labels
#                  (major/minor/patch/dont-release, created by labels.sh)
#   aws-auth     — OIDC role assumption + ECR token for the SLSA jobs
#   image        — build + push the multi-arch image when a version bumped
#   chart        — push the Helm chart; idempotent via `helm pull` precheck
#   *-slsa       — SLSA provenance for both artifacts
#
# Also dispatchable for ad-hoc republishes: supply `tag` to republish an
# image, leave it empty to publish only the chart.
#
# Operator prep (one-time, outside this workflow — see
# docs/publishing-to-ecr.md for the full walkthrough):
#   - IAM role with a GitHub OIDC trust policy for this repository
#   - ECR repos: <repo-name> (image), <repo-name>-chart (chart)
#   - Repo secrets: ECR_AWS_ACCOUNT_ID, ECR_REGION, ECR_ROLE_ARN
#   - Repo variable ECR_PUBLISH_ENABLED=true to arm the publish jobs
#     (until then merges still bump + tag, but nothing is pushed)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. v1.8.2). Leave empty to skip image push.'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Package but do not push.'
        type: boolean
        required: false
        default: false

# contents: write — bump-version pushes the release tag.
# actions: read + packages: write — the nested SLSA generator declares
# packages: write unconditionally ("upload attestations to ghcr.io"),
# even for ECR publishes; the caller's permissions are a hard ceiling.
permissions:
  contents: write
  packages: write
  id-token: write
  issues: read
  pull-requests: read
  actions: read

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  CHART_NAME: ${{ github.event.repository.name }}
  CHART_REPO: ${{ github.event.repository.name }}-chart

jobs:
  # Tagging is registry-independent, so this job is not gated on
  # ECR_PUBLISH_ENABLED — merges bump + tag even before AWS prep is done.
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      tag: ${{ steps.bump.outputs.version }}
      skipped: ${{ steps.bump.outputs.skipped }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jefflinse/pr-semver-bump@v1.7.4
        id: bump
        name: Bump and Tag Version
        with:
          mode: bump
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          require-release-notes: false
          major-label: major
          minor-label: minor
          patch-label: patch
          noop-labels: "dont-release"
          release-notes-prefix: "### RELEASE NOTES"
          with-v: true

  # Fetches an ECR auth token via OIDC and exposes it (masked) to the
  # downstream SLSA reusable workflows. Token is valid ~12h. Gated on
  # ECR_PUBLISH_ENABLED so merges don't go red before the AWS-side prep
  # in docs/publishing-to-ecr.md is complete; dispatch runs bypass the
  # gate for standalone testing.
  aws-auth:
    name: AWS OIDC + ECR login
    runs-on: ubuntu-latest
    if: vars.ECR_PUBLISH_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    outputs:
      registry: ${{ steps.registry.outputs.registry }}
      ecr_password: ${{ steps.token.outputs.password }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_ARN }}
          role-session-name: github-actions-${{ github.event.repository.name }}-publish
          aws-region: ${{ secrets.ECR_REGION }}

      - name: Compute registry hostname
        id: registry
        run: |
          registry="${{ secrets.ECR_AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.ECR_REGION }}.amazonaws.com"
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"

      - name: Get ECR auth token
        id: token
        run: |
          password=$(aws ecr get-login-password --region "${{ secrets.ECR_REGION }}")
          echo "::add-mask::${password}"
          echo "password=${password}" >> "$GITHUB_OUTPUT"

  image:
    name: Publish image
    runs-on: ubuntu-latest
    needs: [aws-auth, bump-version]
    # Runs when aws-auth succeeded and a tag is available from either
    # path: the dispatch input, or a non-skipped bump on push.
    # !cancelled() lifts the implicit success() gate so the dispatch
    # path survives bump-version skipping.
    if: >-
      !cancelled() &&
      needs.aws-auth.result == 'success' &&
      needs.bump-version.result != 'failure' &&
      ((github.event_name == 'workflow_dispatch' && inputs.tag != '') ||
       (github.event_name == 'push' && needs.bump-version.outputs.skipped != 'true' &&
        needs.bump-version.outputs.tag != ''))
    env:
      TAG: ${{ inputs.tag || needs.bump-version.outputs.tag }}
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      published: ${{ steps.digest.outputs.published }}
      registry: ${{ needs.aws-auth.outputs.registry }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_ARN }}
          role-session-name: github-actions-${{ github.event.repository.name }}-image
          aws-region: ${{ secrets.ECR_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.aws-auth.outputs.registry }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest

      - name: Build and push image
        id: bake
        if: inputs.dry_run != true
        uses: docker/bake-action@v7
        with:
          targets: release
          source: .
          files: |
            docker-bake.hcl
            ${{ steps.meta.outputs.bake-file-tags }}
            ${{ steps.meta.outputs.bake-file-labels }}
          set: |-
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Capture image digest
        id: digest
        if: steps.bake.conclusion == 'success' && inputs.dry_run != true
        # fromJSON runs in the expression layer, so only the 71-char
        # digest ever reaches the process environment. Two prior shapes
        # both broke a release:
        #   - inlining ${{ steps.bake.outputs.metadata }} into the
        #     run: script; a paren in the JSON broke shell quoting.
        #   - passing the whole blob through env:. mode=max provenance
        #     embeds the push event payload, which can carry the
        #     squash-merge commit message once per build platform; the
        #     metadata blob can exceed execve's 131,072-byte limit
        #     ("Argument list too long"), so bash never starts and the
        #     image publishes unsigned.
        # Keep the value in env: rather than inlining it — the shell must
        # never parse registry-derived text — but extract it first.
        env:
          DIGEST: ${{ fromJSON(steps.bake.outputs.metadata).release['containerimage.digest'] }}
        run: |
          if [ -z "${DIGEST}" ] || [ "${DIGEST}" = "null" ]; then
            echo "ERROR: failed to capture image digest from bake metadata"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Sign image with cosign
        if: steps.digest.outputs.published == 'true'
        run: |
          cosign sign --yes \
            "${{ needs.aws-auth.outputs.registry }}/${IMAGE_NAME}@${{ steps.digest.outputs.digest }}"

      - name: Write image summary
        if: always()
        run: |
          {
            echo "## ECR Image Publish"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Image | \`${{ needs.aws-auth.outputs.registry }}/${IMAGE_NAME}\` |"
            echo "| Tag | \`${TAG}\` |"
            echo "| Pushed | \`${{ steps.digest.outputs.published || 'false' }}\` |"
            if [ -n "${{ steps.digest.outputs.digest }}" ]; then
              echo "| Digest | \`${{ steps.digest.outputs.digest }}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  image-slsa:
    name: SLSA provenance (image)
    needs: [aws-auth, image]
    if: needs.image.outputs.published == 'true'
    # packages: write — the generator's internal job declares it
    # unconditionally, even though this publishes to ECR. Omitting it
    # fails the entire run at startup via the nested-permissions ceiling.
    permissions:
      id-token: write
      contents: read
      actions: read
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      # env context is not available in reusable-workflow inputs — derive
      # the image ref from the github context directly.
      image: ${{ needs.aws-auth.outputs.registry }}/${{ github.event.repository.name }}
      digest: ${{ needs.image.outputs.digest }}
      registry-username: AWS
    secrets:
      registry-password: ${{ needs.aws-auth.outputs.ecr_password }}

  chart:
    name: Publish chart
    runs-on: ubuntu-latest
    needs: [aws-auth, bump-version]
    # Runs on every armed main push and on dispatch (bump-version
    # skipped) — the idempotency precheck makes re-runs a no-op.
    if: >-
      !cancelled() &&
      needs.aws-auth.result == 'success' &&
      needs.bump-version.result != 'failure'
    outputs:
      chart_version: ${{ steps.version.outputs.chart_version }}
      digest: ${{ steps.push.outputs.digest }}
      published: ${{ steps.push.outputs.published }}
      registry: ${{ needs.aws-auth.outputs.registry }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_ARN }}
          role-session-name: github-actions-${{ github.event.repository.name }}-chart
          aws-region: ${{ secrets.ECR_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Resolve chart directory
        run: |
          chart_dir=$(echo charts/*/)
          chart_dir="${chart_dir%/}"
          echo "CHART_DIR=${chart_dir}" >> "$GITHUB_ENV"

      - uses: orhun/git-cliff-action@v4
        with:
          config: ${{ env.CHART_DIR }}/cliff.toml
          args: --include-path "charts/**" --output ${{ env.CHART_DIR }}/CHANGELOG.md
        env:
          OUTPUT: ${{ env.CHART_DIR }}/CHANGELOG.md

      - name: Read chart version
        id: version
        run: |
          chart_version=$(yq '.version' "${CHART_DIR}/Chart.yaml")
          echo "chart_version=${chart_version}" >> "$GITHUB_OUTPUT"
          echo "Chart version: ${chart_version}"

      - name: Check if version already published
        id: idempotency
        run: |
          registry="${{ needs.aws-auth.outputs.registry }}"
          if helm pull \
              "oci://${registry}/${CHART_REPO}" \
              --version "${{ steps.version.outputs.chart_version }}" \
              --destination /tmp 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Chart ${{ steps.version.outputs.chart_version }} already published, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Helm registry login
        if: steps.idempotency.outputs.exists != 'true'
        run: |
          registry="${{ needs.aws-auth.outputs.registry }}"
          aws ecr get-login-password --region "${{ secrets.ECR_REGION }}" | \
            helm registry login "${registry}" \
              --username AWS \
              --password-stdin

      - name: Package chart
        if: steps.idempotency.outputs.exists != 'true'
        run: helm package "${CHART_DIR}"

      - name: Upload chart artifact (dispatch only)
        if: |
          steps.idempotency.outputs.exists != 'true' &&
          github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: chart-${{ steps.version.outputs.chart_version }}-ecr
          path: ${{ env.CHART_NAME }}-${{ steps.version.outputs.chart_version }}.tgz
          retention-days: 14

      - name: Push chart
        id: push
        if: |
          steps.idempotency.outputs.exists != 'true' &&
          inputs.dry_run != true
        run: |
          registry="${{ needs.aws-auth.outputs.registry }}"
          tgz="${CHART_NAME}-${{ steps.version.outputs.chart_version }}.tgz"
          helm push "${tgz}" "oci://${registry}/${CHART_REPO}" 2>&1 | tee /tmp/push.log
          digest=$(grep -oE 'sha256:[a-f0-9]{64}' /tmp/push.log | head -1)
          if [ -z "${digest}" ]; then
            echo "ERROR: failed to capture digest from helm push output"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Sign chart with cosign
        if: steps.push.outputs.published == 'true'
        run: |
          cosign sign --yes \
            "${{ needs.aws-auth.outputs.registry }}/${CHART_REPO}@${{ steps.push.outputs.digest }}"

      - name: Write chart summary
        if: always()
        run: |
          {
            echo "## ECR Chart Publish"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Chart | \`${CHART_NAME}\` |"
            echo "| Version | \`${{ steps.version.outputs.chart_version }}\` |"
            echo "| Already published | \`${{ steps.idempotency.outputs.exists }}\` |"
            echo "| Pushed | \`${{ steps.push.outputs.published || 'false' }}\` |"
            if [ -n "${{ steps.push.outputs.digest }}" ]; then
              ver="${{ steps.version.outputs.chart_version }}"
              uri="oci://${{ needs.aws-auth.outputs.registry }}/${CHART_REPO}:${ver}"
              echo "| Digest | \`${{ steps.push.outputs.digest }}\` |"
              echo "| OCI URL | \`${uri}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  chart-slsa:
    name: SLSA provenance (chart)
    needs: [aws-auth, chart]
    if: needs.chart.outputs.published == 'true'
    # packages: write — same nested-ceiling requirement as image-slsa.
    permissions:
      id-token: write
      contents: read
      actions: read
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.aws-auth.outputs.registry }}/${{ github.event.repository.name }}-chart
      digest: ${{ needs.chart.outputs.digest }}
      registry-username: AWS
    secrets:
      registry-password: ${{ needs.aws-auth.outputs.ecr_password }}
